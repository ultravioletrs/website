faqs:
  - q: "What is air-gapped AI deployment for defense?"
    a: "Air-gapped AI deployment means running the complete AI stack — inference, retrieval, guardrails, governance, and audit — with zero network connectivity. No inbound or outbound internet access. After initial deployment via offline media transfer, the system operates fully disconnected. Cube AI is designed for this mode: all capabilities function in the disconnected state, with audit logs exportable via offline channels."
  - q: "Why can't defense organizations use commercial cloud AI?"
    a: "Commercial cloud AI requires internet connectivity and processes workloads on infrastructure outside the defense organization's control. For classified and mission-critical environments, this fails two hard requirements: (1) no data may traverse an uncontrolled network path; (2) no third party may have access to the infrastructure processing classified content. Air-gapped, hardware-isolated on-premise AI eliminates both failure modes."
  - q: "What is hardware TEE isolation and why does it matter for defense?"
    a: "A Trusted Execution Environment is a hardware-isolated region inside the CPU where computation is encrypted in memory, invisible to the host OS, hypervisor, and any other process on the hardware. For defense AI, TEE isolation means that even a compromised host OS cannot access the AI workload's memory — model weights, prompts, and outputs remain sealed. Cocos AI manages TEE provisioning and remote attestation for the full Ultraviolet stack."
  - q: "What is remote attestation and how is it used in defense AI?"
    a: "Remote attestation is a cryptographic process where the CPU hardware generates a signed report proving that a specific, unmodified software workload is running inside a genuine TEE. For defense AI, attestation provides the technical evidence that the correct, approved AI system is running — rather than a compromised or modified version. Attestation reports serve as audit artifacts for security accreditation processes."
  - q: "How are model weights protected in a defense deployment?"
    a: "When Cube AI runs inside an AMD SEV-SNP or Intel TDX TEE, model weights are loaded into hardware-encrypted TEE memory. The host OS, hypervisor, and any privileged process outside the enclave see only ciphertext. The weights can also be sealed to the enclave — encrypted with a key bound to the enclave's identity — so they cannot be read even if the storage media is removed."
  - q: "Can Cube AI meet CMMC requirements?"
    a: "CMMC (Cybersecurity Maturity Model Certification) requirements for AI systems used by defense contractors depend on the classification level and the data processed. On-premise Cube AI deployment addresses core CMMC technical controls: access control (RBAC, domain isolation), audit and accountability (complete queryable audit trail), configuration management (version-controlled model and guardrail deployments), and system and communications protection (no data egress by default). Specific CMMC level applicability requires assessment against your CUI or classified data handling requirements."
