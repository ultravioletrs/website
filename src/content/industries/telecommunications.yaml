faqs:
  - q: "What is confidential AI for telecommunications?"
    a: "Confidential AI for telecommunications is the deployment of AI workloads — network anomaly detection, traffic optimization, predictive maintenance, and multi-operator analytics — inside Trusted Execution Environments, so that proprietary network data is never exposed to cloud providers, other operators, or infrastructure administrators. The hardware enforces the boundary; no data leaves the operator's perimeter in readable form."
  - q: "How do multiple telecoms collaborate on AI without sharing network data?"
    a: "Each operator runs its portion of the workload inside a TEE. Inputs from each operator are sealed in hardware — the other operators and the platform operator cannot read them. Only the agreed result — a joint anomaly score, a shared model weight update, or an aggregated metric — is released. Remote attestation proves which code produced the result, satisfying cross-operator trust requirements without contractual data-sharing agreements."
  - q: "What is CONFIDENTIAL6G?"
    a: "CONFIDENTIAL6G is a €5 million EU Horizon Europe research project validating confidential computing infrastructure for 6G networks. Ultraviolet's Cocos AI is the confidential computing substrate in this project, working alongside global telecom leaders. The project demonstrates that TEE-based AI can meet the security and latency requirements of next-generation mobile network infrastructure."
  - q: "What AI use cases are relevant for telecom operators?"
    a: "Key AI use cases in telecommunications include: network anomaly and intrusion detection (requires processing raw traffic data), predictive maintenance on network hardware, dynamic spectrum and traffic optimization, multi-operator roaming analytics, customer churn prediction, and 6G slice management. All of these involve sensitive network intelligence that operators cannot safely send to a third-party cloud."
  - q: "Can confidential AI workloads run at the network edge?"
    a: "Yes. Cube AI supports edge deployment for distributed network sites where latency requirements make centralized processing impractical. TEEs are available on edge-class hardware including NVIDIA platforms with confidential GPU support. This enables anomaly detection and traffic optimization to run locally at a base station or edge data centre, with results aggregated centrally."
  - q: "How does confidential computing protect operator competitive advantage?"
    a: "Network intelligence — traffic patterns, subscriber behavior, optimization algorithms — is core competitive IP for any operator. Sending this data to a shared cloud AI platform exposes it to the platform provider and, potentially, to other tenants. TEE-based deployment seals the data in hardware: even the infrastructure vendor and the platform operator cannot read it. Competitive intelligence stays inside the operator."

