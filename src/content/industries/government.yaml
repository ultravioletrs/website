faqs:
  - q: "What is sovereign AI for government?"
    a: "Sovereign AI for government means AI that runs on national infrastructure under national jurisdiction — not in a foreign commercial cloud. It requires that citizen data, policy content, and operational information stay within the country's physical and legal boundary, with governance set by the government agency, not a vendor's terms of service."
  - q: "Why can't government agencies use commercial cloud AI?"
    a: "Commercial cloud AI creates three structural problems for government: (1) data leaves national jurisdiction on every API call, creating sovereignty risk; (2) the US CLOUD Act allows US authorities to compel US cloud providers to produce data stored anywhere globally, including data belonging to foreign governments; (3) audit trails and governance artifacts are vendor-controlled, not government-controlled — making regulatory accountability difficult."
  - q: "What regulations govern AI in government?"
    a: "Government AI is subject to national data protection laws, sector-specific security frameworks, and — for EU member states — the EU AI Act (high-risk AI system requirements enforceable from August 2026), GDPR, and NIS2 (transposition deadline October 2024). Defense workloads face additional classification handling requirements. All require demonstrable jurisdictional control over AI infrastructure."
  - q: "How does Cube AI satisfy government data residency requirements?"
    a: "Cube AI runs on infrastructure the government agency operates or controls — on-premises data centres, national sovereign cloud, or air-gapped facilities. No data leaves this perimeter. Network policies enforce zero egress by default. The audit trail is owned by the agency, not the vendor. Data residency is a hardware guarantee, not a contractual commitment from a foreign provider."
  - q: "Can government AI be air-gapped?"
    a: "Yes. Cube AI is designed for air-gapped operation. After initial deployment and model loading via offline media, it operates with zero network connectivity. All inference, RAG, guardrails, governance, and audit logging work in the disconnected state. This meets the strictest classification handling requirements for national security workloads."
  - q: "What is hardware attestation and why do governments need it?"
    a: "Hardware attestation is a cryptographic proof — generated by the CPU hardware itself — that a specific, unmodified AI workload is running in an isolated Trusted Execution Environment. For governments, attestation provides the strongest available evidence that AI processing occurred exactly as intended, with no unauthorized access. It is stronger than any contractual or audit-log-based assurance a vendor can provide."
