faqs:
  - q: "What is secure AI deployment?"
    a: "Secure AI deployment means running AI models on infrastructure you control — on-premise, air-gapped, or inside hardware Trusted Execution Environments — so that prompts, inference inputs, and outputs never leave your perimeter. It eliminates the security and compliance exposure of sending sensitive data to a third-party cloud AI API."
  - q: "How do I deploy an LLM on-premise securely?"
    a: "Secure on-premise LLM deployment requires five layers: (1) TEE-capable hardware for maximum isolation; (2) an auditable, self-hosted AI platform like Cube AI; (3) network policies blocking outbound data egress by default; (4) role-based governance with a complete audit trail; (5) remote attestation if using hardware TEEs. Each layer closes a distinct attack surface."
  - q: "What is an air-gapped AI deployment?"
    a: "An air-gapped AI deployment runs with zero network connectivity — the AI infrastructure has no inbound or outbound internet access. Model weights, configuration, and audit exports are transferred via offline media. Required for classified environments, critical infrastructure, and any workload where physical network isolation is a security or regulatory requirement."
  - q: "What is private AI inference?"
    a: "Private AI inference means running LLM inference on your own hardware so prompts and responses never leave your network. In contrast to cloud APIs — where every request traverses and is processed on vendor infrastructure — private inference keeps all computation inside your perimeter. Cube AI delivers private inference via vLLM and Ollama runtimes on your own GPU hardware."
  - q: "On-premise vs cloud AI: which is more secure?"
    a: "On-premise AI eliminates the data transfer and third-party access risks inherent in cloud AI APIs. Cloud AI requires sending prompts to vendor infrastructure subject to the vendor's access policies and any legal orders under laws like the US CLOUD Act. On-premise keeps all data local. The trade-off is operational responsibility — you manage the hardware, models, and updates rather than the vendor."
  - q: "What GPU hardware do I need for private LLM inference?"
    a: "Cube AI supports NVIDIA GPU hardware: A100, H100, and Blackwell GPUs for high-throughput inference. For confidential computing, NVIDIA H100 supports confidential computing mode alongside AMD SEV-SNP or Intel TDX CPU TEEs. For smaller models or edge deployments, Cube AI also supports CPU inference via Ollama. The right hardware depends on model size, throughput requirements, and isolation needs."
  - q: "Can I use open-source models in a private deployment?"
    a: "Yes. Cube AI is model-agnostic and serves open-weight models including Llama, Mistral, Qwen, DeepSeek, Phi, and Gemma, plus custom fine-tunes in GGUF or safetensors format. All model weights stay inside your perimeter — registered, versioned, and served from your own storage without any call back to the original model provider."
  - q: "How does private AI deployment help with GDPR compliance?"
    a: "GDPR Article 5 requires that personal data be processed with appropriate technical measures. Processing personal data through a cloud AI API creates a transfer to a data processor (the AI vendor) requiring appropriate safeguards. On-premise deployment eliminates the transfer entirely — personal data is processed inside your own infrastructure, under your own data processing controls, with no third-party processor involved."
