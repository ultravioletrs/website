faqs:
  - q: "What is private agentic AI?"
    a: "Private agentic AI is the deployment of autonomous AI agents — systems that use a language model to plan, take actions, retrieve information, and produce multi-step outputs — on infrastructure you own, so that every tool call, document retrieval, and intermediate result stays inside your network. No interaction with the agent loop passes through a hosted API or a third-party server."
  - q: "How do I run LangChain or AutoGPT on my own infrastructure?"
    a: "Agent frameworks like LangChain, AutoGPT, CrewAI, and custom agent loops communicate with a language model via an OpenAI-compatible API. Cube AI exposes this same API format, so you change the base URL and API key in your agent configuration to point to your on-premises Cube AI instance. No code changes are required in the agent framework itself."
  - q: "What data does an agentic AI workflow send to a hosted provider?"
    a: "In a typical agentic workflow on a hosted API, every component of the loop is transmitted: the original user query, each tool call and its response, every document chunk retrieved from your knowledge base, all intermediate reasoning steps, and the final output. Over many interactions, this exposes your proprietary documents, workflows, and operational data to the provider's infrastructure."
  - q: "How do guardrails work in an agentic AI pipeline?"
    a: "In Cube AI, NeMo guardrails are applied on the inference path — not at the application layer. Every prompt sent to the model and every response returned passes through the guardrail logic before reaching the agent. This ensures policy enforcement cannot be bypassed by crafting inputs that manipulate the application-layer filtering, and it applies consistently across every agent loop iteration."
  - q: "Can I run coding agents privately?"
    a: "Yes. Cube AI includes integrations for coding agent frameworks including Continue and OpenCode. These editors connect to Cube AI's OpenAI-compatible API, so code completions, inline suggestions, and multi-file edits are generated by a model running on your own infrastructure. No source code is transmitted to a third-party provider."
  - q: "What is the difference between private AI and agentic AI?"
    a: "Private AI describes where inference runs — on your own infrastructure. Agentic AI describes how the model is used — in an autonomous loop that calls tools, retrieves documents, and acts across multiple steps. Private agentic AI combines both: the agent loop runs entirely on private infrastructure, with no external API calls at any step."

