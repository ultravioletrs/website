faqs:
  - q: "What is confidential computing?"
    a: "Confidential computing is a hardware security paradigm that protects data in use by performing computation inside a Trusted Execution Environment — a hardware-isolated region where code and data are encrypted in memory at all times. Unlike encryption at rest or in transit, it protects data during processing, when it would otherwise be decrypted and visible to the OS and hypervisor."
  - q: "What is a Trusted Execution Environment (TEE)?"
    a: "A TEE is a hardware-isolated region inside a CPU — such as an AMD SEV-SNP confidential VM or an Intel TDX Trust Domain — where code and data are encrypted in memory at all times. Even the hypervisor and host OS cannot read the contents. Remote attestation lets you cryptographically verify that the correct, unmodified software is running inside the enclave before trusting it with sensitive data."
  - q: "What is the difference between confidential computing and encryption?"
    a: "Encryption protects data at rest (storage) and in transit (network). Confidential computing protects data in use — while it is being processed. Standard encryption requires decrypting data before computation, leaving it exposed in RAM. A TEE keeps data encrypted in memory during processing; the plaintext exists only inside CPU registers during computation, never in accessible RAM."
  - q: "How does remote attestation work?"
    a: "Remote attestation is the process by which a client verifies that a TEE contains the correct, unmodified software before sending sensitive data. The TEE generates a hardware-signed attestation report containing cryptographic measurements of what is running inside. The client verifies this report against the hardware manufacturer's certificate chain (AMD or Intel), confirming the enclave is genuine and unmodified."
  - q: "Is confidential computing slower than standard computing?"
    a: "Memory encryption overhead for CPU workloads on AMD SEV-SNP and Intel TDX is typically under 5% for most workloads. LLM inference is GPU-bound, so CPU memory encryption adds minimal latency. NVIDIA H100 confidential computing mode introduces some overhead on GPU-host data transfers. In practice, performance impact is workload-dependent and significantly lower than alternatives like homomorphic encryption, which is 1,000–10,000× slower."
  - q: "What is the difference between confidential computing and homomorphic encryption?"
    a: "Confidential computing uses hardware TEEs to protect data in use at near-native performance. Homomorphic encryption (HE) performs computation directly on encrypted data without a hardware enclave — no decryption required at any point. HE is mathematically elegant but currently 1,000–10,000× slower than native computation, making it impractical for production AI workloads. TEEs are the only production-viable approach for confidential AI inference today."
  - q: "Does confidential computing protect model weights?"
    a: "Yes. When an LLM runs inside a TEE, the model weights are loaded into encrypted TEE memory and never exposed to the host OS, hypervisor, or cloud operator. This protects proprietary fine-tuned models from exfiltration by the infrastructure operator — a critical requirement for organizations deploying commercially valuable AI models on shared or third-party hardware."
  - q: "What AI workloads benefit from confidential computing?"
    a: "Any AI workload processing sensitive input data benefits: LLM inference on patient records, legal documents, or financial data; multi-party AI training where participants cannot share raw datasets; RAG pipelines over confidential knowledge bases; and fine-tuned model serving where the weights themselves are proprietary. Cocos AI is purpose-built for these workloads."
