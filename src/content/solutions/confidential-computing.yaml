stepsEyebrow: "How it works"
stepsH2: "Confidential computing, step by step."
stepsSub: "A TEE creates a hardware-enforced boundary around computation. These are the five stages from hardware initialization to verified secure inference."
stepsItems:
  - title: "TEE initialization"
    body: "The CPU initializes a Trusted Execution Environment — a hardware-isolated region of memory protected by the processor's memory encryption engine. On AMD SEV-SNP systems, each confidential VM gets its own AES-128 encryption key managed exclusively by the AMD Secure Processor. On Intel TDX systems, Trust Domain Extensions create hardware-isolated Trust Domains with similar guarantees."
  - title: "Code and data loaded into the enclave"
    body: "The AI application — model weights, inference runtime, and input data — is loaded into the TEE. The CPU measures a cryptographic hash of everything loaded, creating a record of exactly what is running inside the enclave. This measurement becomes the basis for remote attestation."
  - title: "Processing with memory encryption"
    body: "All computation happens inside the enclave with memory encrypted by the CPU's memory encryption engine. When data is written to RAM, it is automatically encrypted. When read back for processing, it is decrypted only inside the CPU core. The host OS, hypervisor, and any co-located workloads see only ciphertext."
  - title: "Remote attestation"
    body: "Before a client sends sensitive data to the enclave, it requests an attestation report. The TEE generates a hardware-signed report containing the measurements of what is running inside. The client verifies this report against AMD's or Intel's certificate chain, confirming that the hardware is a genuine TEE, the correct unmodified software is running, and the enclave is in a secure state."
  - title: "Sealed result returned"
    body: "Inference results are returned to the client over a secure channel established after attestation. The host operator can see that computation occurred and when — but cannot see prompts, model weights, or outputs. The enclave can optionally seal state to disk, encrypted in a key only it can access."

detailsEyebrow: "Implementations"
detailsH2: "TEE hardware: what to evaluate."
detailsSub: "Three major hardware TEE implementations are commercially available today. Each offers different trade-offs in performance overhead, VM granularity, and attestation infrastructure."
detailsItems:
  - title: "AMD SEV-SNP"
    body: "Confidential VM-level isolation with hardware-enforced memory integrity. SNP adds page access controls that prevent the hypervisor from remapping guest memory. Supported on AMD EPYC 3rd gen (Milan) onward. Available on Azure, Google Cloud, and AWS confidential VM offerings."
  - title: "Intel TDX"
    body: "Hardware-isolated Trust Domains at the VM level, built on Intel VT-x with a new SEAM CPU mode that shields Trust Domain memory from the VMM and host OS. Supported on Intel 4th gen Xeon Scalable (Sapphire Rapids) and later. Available in Azure Confidential VMs."
  - title: "NVIDIA H100 Confidential Computing"
    body: "GPU-level confidential computing for LLM inference. In CC mode, GPU memory is encrypted and isolated from the host CPU and driver stack. The H100 generates its own attestation report, combinable with a CPU TEE attestation for end-to-end verification of the full inference path. The only hardware path for confidential GPU-accelerated AI today."

