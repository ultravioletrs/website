title: "What Is Confidential Computing? TEEs, Attestation & AI Security | Ultraviolet"
description: "Confidential computing protects data in use inside hardware-enforced Trusted Execution Environments. Learn how AMD SEV-SNP and Intel TDX work, and why it matters for AI."
eyebrow: "Solution · Confidential Computing"
h1: "Protect data in use —<br /><span class=\"hero__accent\">down to the hardware.</span>"
sub: "Confidential computing uses hardware-enforced Trusted Execution Environments to keep data encrypted even while it is being processed — so your AI workloads are sealed from the host, the hypervisor, and the cloud operator."

explainerEyebrow: "Definition"
explainerH2: "What Is Confidential Computing?"
explainerBody: "Confidential computing is a hardware security paradigm that protects data in use by performing computation inside a Trusted Execution Environment (TEE) — a hardware-isolated region of the CPU where code and data are encrypted in memory at all times. Unlike encryption at rest (storage) or in transit (network), confidential computing addresses the hardest problem: data is normally decrypted to be processed, exposing it to the OS, hypervisor, and anyone with physical or privileged access. A TEE eliminates that exposure: data is decrypted only inside the enclave, and the plaintext is never visible outside it."
explainerChips:
  - "Data encrypted in use"
  - "Isolated from host OS and hypervisor"
  - "AMD SEV-SNP and Intel TDX"
  - "Cryptographic remote attestation"
  - "NVIDIA H100 GPU TEE support"

compH2: "The gap encryption alone<br />cannot close."
compBody: "Standard encryption protects data at rest and in transit — but the moment data is processed, it must be decrypted. That decrypted data is visible to the operating system, the hypervisor, and anyone with administrative or physical access. For AI workloads processing sensitive data at inference time, this is a fundamental exposure that firewall rules and access policies cannot eliminate."
compHeaders: ["Encryption-only approach", "Confidential Computing"]
compRows:
  - ["Data at rest", "Encrypted on disk.", "Encrypted on disk."]
  - ["Data in transit", "Encrypted in flight.", "Encrypted in flight."]
