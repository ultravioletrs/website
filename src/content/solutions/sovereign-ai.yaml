faqs:
  - q: "What is sovereign AI?"
    a: "Sovereign AI is AI that runs on infrastructure under your direct control and legal jurisdiction — not in a foreign commercial cloud. It requires hardware ownership or lease within your jurisdiction, data residency guarantees, organization-defined governance policies, and optionally cryptographic proof via remote attestation that no unauthorized party can access the computation."
  - q: "What is the difference between data sovereignty and AI sovereignty?"
    a: "Data sovereignty means controlling where data is stored. AI sovereignty means controlling the entire AI lifecycle: where data is stored, where models run, who can access inference outputs, what governance policies apply, and who can audit the system. You can have data sovereignty without AI sovereignty if your data stays local but your models run on a foreign cloud API."
  - q: "Why do countries need sovereign AI?"
    a: "Countries need sovereign AI to protect national security, comply with data protection laws, prevent foreign intelligence access to sensitive workloads, and maintain operational independence. The US CLOUD Act (2018) authorizes US law enforcement to compel US cloud providers to produce data stored anywhere in the world, including data belonging to foreign governments."
  - q: "What are the risks of using foreign AI cloud services?"
    a: "Foreign AI cloud services expose organizations to five structural risks: (1) foreign surveillance laws such as the US CLOUD Act grant foreign governments legal access to your data; (2) vendor lock-in creates operational dependency on a foreign commercial entity; (3) regulatory non-compliance when data processing falls under GDPR, EU AI Act, or sectoral mandates; (4) supply chain disruption if the vendor restricts access; (5) model IP loss when proprietary data is processed on vendor infrastructure."
  - q: "Is private AI the same as sovereign AI?"
    a: "Not exactly. Private AI means your data does not leave your network during inference. Sovereign AI adds jurisdictional control, governance policy ownership, and hardware attestation on top of privacy. All sovereign AI is private AI, but private AI deployed on a foreign cloud — even in a private VPC — is not fully sovereign because the cloud provider retains physical and legal access to the infrastructure."
  - q: "What hardware is needed for sovereign AI?"
    a: "Sovereign AI requires compute infrastructure in your jurisdiction: on-premises GPU servers, a national sovereign cloud, or a private data centre. For the strongest isolation, TEE-capable hardware — AMD SEV-SNP confidential VMs or Intel TDX Trust Domains — encrypts model weights and inference inputs in memory so that even the host operator cannot access plaintext."
  - q: "Does sovereign AI require air-gapping?"
    a: "No. Air-gapping (zero network connectivity) is the maximum isolation level, required for classified workloads. Most sovereign AI deployments need outbound connectivity for updates and monitoring, but with no egress of prompt data or model outputs. The key requirement is that user data and model inference stay inside your perimeter — not that the servers are physically disconnected."
  - q: "How does the EU AI Act affect sovereign AI requirements?"
    a: "The EU AI Act classifies certain applications as high-risk AI systems, requiring conformity assessments, audit trails, and technical documentation. High-risk AI system requirements are fully enforceable from August 2026. Sovereign AI infrastructure — running on hardware you control with a complete audit trail — provides the technical controls needed to demonstrate compliance with Articles 9, 12, and 17."
