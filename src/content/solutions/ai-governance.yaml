faqs:
  - q: "What does GDPR require for AI deployments?"
    a: "GDPR requires that AI systems processing personal data implement data protection by design and by default (Article 25), limit processing to declared purposes (Article 5), document the legal basis for processing, and avoid international transfers without adequate safeguards (Article 44). On-premise AI deployment eliminates Article 44 cross-border transfer risk and provides the architectural foundation for Articles 5 and 25."
  - q: "When do EU AI Act requirements apply to my AI system?"
    a: "The EU AI Act imposes tiered requirements based on risk. High-risk AI systems — those used in employment, credit, education, critical infrastructure, biometrics, and law enforcement contexts — must meet requirements including a risk management system, data governance, technical documentation, automatic logging, and a quality management system. These requirements are fully enforceable from August 2026 for high-risk systems."
  - q: "What technical controls does the EU AI Act require?"
    a: "For high-risk AI systems, the EU AI Act requires: a risk management system covering the AI lifecycle (Article 9), data governance and management practices (Article 10), technical documentation maintained throughout the system's lifetime (Article 11), automatic logging sufficient to reconstruct what happened (Article 12), transparency measures for deployers and users (Article 13), and a quality management system (Article 17). Cube AI's audit trail, guardrails, and governance dashboard directly address Articles 9, 10, 11, 12, and 17."
  - q: "Does DORA apply to AI systems used by financial institutions?"
    a: "Yes. DORA (in force January 2025) requires EU financial entities to manage ICT third-party risk, including cloud AI API providers. Cloud AI APIs are ICT third-party services under DORA Articles 28–30, requiring contractual documentation, audit rights, and exit plans. On-premise AI deployment eliminates the third-party ICT dependency entirely — there is no third party to manage."
  - q: "What is the difference between AI governance and AI compliance?"
    a: "AI compliance refers to meeting specific regulatory requirements — GDPR, EU AI Act, HIPAA, DORA. AI governance refers to the internal systems and processes for managing AI use responsibly: who approves models, how policies are set and enforced, how incidents are investigated. Good AI governance produces compliance as an output: when you have the right audit trails, access controls, and policy enforcement, you have the evidence regulators require."
  - q: "How does Cube AI's audit trail support regulatory requirements?"
    a: "Cube AI records every prompt, guardrail decision, policy change, and administrative action in a structured, queryable audit log stored inside your perimeter. Each entry is timestamped and attributed to an authenticated principal. The log is exportable in standard formats. For EU AI Act Article 12 (automatic logging), HIPAA audit controls, and DORA ICT incident records, this audit trail is the primary technical evidence of what your AI system did and when."
  - q: "What is hardware attestation and why does it matter for compliance?"
    a: "Hardware attestation is a cryptographic process by which a Trusted Execution Environment generates a hardware-signed report proving that specific software is running in an unmodified enclave. For AI compliance, attestation provides the highest-assurance evidence that data was processed in an isolated environment — stronger than any contractual assurance a cloud vendor can provide. Relevant for EU AI Act high-risk systems requiring demonstrable technical data protection controls."
