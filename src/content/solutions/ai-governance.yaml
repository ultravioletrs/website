explainerEyebrow: "The compliance problem"
explainerH2: "GDPR AI compliance requires more than a data processing agreement."
explainerBody: "GDPR, the EU AI Act, DORA, HIPAA, and sector-specific mandates create technical requirements that a contractual relationship with a cloud AI vendor cannot satisfy. Regulators increasingly demand demonstrable technical controls — audit trails you own, policies enforced at the infrastructure layer, and evidence of where and how data was processed. 'We use a GDPR-compliant vendor' is not a technical control. Governance built into the infrastructure is."
