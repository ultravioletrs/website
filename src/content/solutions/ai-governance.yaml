  - "EU AI Act — high-risk systems from August 2026"
  - "DORA — January 2025 financial sector"
  - "NIS2 — October 2024 transposition"
  - "HIPAA — US healthcare"

compH2: "Hosted AI compliance<br />is contractual, not architectural."
compBody: "Governance for hosted AI depends on vendor promises, contractual SLAs, and borrowed audit artifacts. That is not compliance by architecture — it is compliance by hope. Regulators and legal teams need more: audit trails you own, policies you enforce, and technical evidence you generate yourself."
