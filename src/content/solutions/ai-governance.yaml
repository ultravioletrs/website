detailsEyebrow: "Regulatory landscape"
detailsH2: "AI compliance frameworks you need to satisfy."
detailsSub: "These are the active regulatory frameworks with direct implications for how organizations deploy AI. Dates are enforcement dates, not publication dates."
detailsItems:
  - title: "EU AI Act — High-Risk AI Systems"
    body: "The EU AI Act classifies AI systems in sensitive domains (HR, credit, education, critical infrastructure, biometrics) as high-risk. High-risk AI system requirements are fully enforceable from August 2026. Requirements include: a documented risk management system (Article 9), data governance and data management practices (Article 10), technical documentation (Article 11), automatic logging of operation (Article 12), transparency to users (Article 13), and a quality management system (Article 17). Sovereign AI on infrastructure you control provides the technical foundation for all of these."
  - title: "GDPR — General Data Protection Regulation"
    body: "In force since May 2018. Article 5 requires personal data be processed lawfully, fairly, and transparently, with purpose limitation and data minimisation. Article 25 requires data protection by design and by default — technical controls baked into the architecture, not bolted on. Article 44 restricts transfers of personal data to third countries. Running AI on your own infrastructure eliminates Article 44 transfers entirely."
  - title: "DORA — Digital Operational Resilience Act"
    body: "In force January 2025 for EU financial entities. DORA requires financial institutions to manage ICT third-party risk under Articles 28–30. A cloud AI API is an ICT third-party service under DORA. Requirements include contractual documentation, audit rights, exit plans, and concentration risk management. On-premise AI eliminates the third-party ICT dependency entirely."
  - title: "NIS2 — Network and Information Security Directive 2"
    body: "EU member state transposition deadline October 2024. NIS2 extends cybersecurity obligations to a broader set of critical infrastructure entities. Covered organizations must implement appropriate technical and organisational measures for AI systems used in critical operations. Sovereign AI deployment with hardware attestation satisfies NIS2's technical controls requirements."
  - title: "HIPAA — Health Insurance Portability and Accountability Act"
    body: "US law governing Protected Health Information. HIPAA's Technical Safeguard standards require access controls, audit controls, integrity controls, and transmission security for systems handling PHI. AI inference on clinical data must occur in a HIPAA-compliant environment. On-premise deployment with Cube AI's audit trail, RBAC, and guardrails satisfies HIPAA Technical Safeguard requirements."
  - title: "Sector-Specific: CMMC, FedRAMP, NCSC"
    body: "US federal AI deployments face FedRAMP authorization requirements and, for defense contractors, CMMC (Cybersecurity Maturity Model Certification) at appropriate levels. UK public sector AI must align with NCSC guidance. In all cases, demonstrable technical controls — hardware-attested infrastructure, complete audit trails, policy enforcement at the infrastructure layer — provide the evidence base regulators require."

stepsEyebrow: "Technical controls"
stepsH2: "AI governance controls that satisfy regulators."
stepsSub: "These are the technical controls that move compliance from contractual promise to architectural fact — the ones regulators can audit rather than just receive documentation for."
stepsItems:
  - title: "Complete audit trail for every AI interaction"
    body: "Cube AI records every prompt, guardrail decision, model response, policy change, and administrative action in a queryable, exportable audit log. The audit trail is stored inside your perimeter — not in a vendor's logging service. Every entry is timestamped, attributed to an authenticated user or system, and tamper-evident. For EU AI Act Article 12 (record-keeping) and HIPAA audit controls: this is the evidence base."
  - title: "Policy enforcement at the infrastructure layer"
    body: "Guardrails in Cube AI are enforced by the Cube Proxy — the layer through which every inference request passes. Policies cannot be bypassed at the application layer because enforcement is below the application. NeMo Guardrails handle prompt injection defense and content policy; Presidio handles PII detection and redaction. Every guardrail decision is logged. This is policy enforcement by architecture, not by convention."
  - title: "Role-based access control with domain isolation"
    body: "Cube AI's multi-domain architecture creates strictly separated workspaces. Each team, department, or use case operates in its own domain with its own identity namespace, model access permissions, and audit log partition. RBAC and ABAC policies control who can register models, modify guardrails, read audit logs, and access specific domains. Principle of least privilege is enforced at the platform level."
  - title: "Hardware attestation for maximum assurance"
    body: "For high-risk AI systems requiring the strongest evidence of data-in-use protection: Cocos AI provides hardware remote attestation. Before any sensitive data is processed, clients receive a hardware-signed attestation report from the TEE (AMD SEV-SNP or Intel TDX). This report cryptographically proves that the correct, unmodified Cube AI software is running in an isolated enclave. For regulators requiring technical evidence of data protection during AI processing, attestation is the highest-assurance control available."
  - title: "Data residency enforcement"
    body: "For GDPR Article 44, DORA data residency requirements, and national data sovereignty mandates: on-premise deployment enforces data residency at the infrastructure level, not the contract level. No API call, no model output, and no audit event leaves your defined boundary without an explicit policy exception. Network-level controls enforce this — it is not a configuration option that can be accidentally overridden."

